<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Exciting Expeditions for whitewater rafting questions, trip reservations, location info, and feedback.">
    <meta name="author" content="Fernando José Rodríguez Henríquez">
    <title>Contact Us - Exciting Expeditions</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Exciting Expeditions Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>Exciting Expeditions</h1>
            <p>123 Main River Street, Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p><a href="mailto:info@excitingexpeditions.com">info@excitingexpeditions.com</a></p>

            <div class="map-box">
                <!-- Reemplaza el src por el enlace "Embed a map" de Google Maps que elijas (sin style="border:0") -->
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.835434509374!2d-122.4194155!3d37.7749295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDQ2JzI5LjciTiAxMjLCsDI1JzA5LjkiVw!5e0!3m2!1sen!2sus!4v1600000000000!5m2!1sen!2sus"
                    width="400"
                    height="300"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                    title="Exciting Expeditions Location Map">
                </iframe>
            </div>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Placeholder" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <fieldset class="form-group">
                    <legend>Message Purpose</legend>
                    <label for="purpose-general">
                        <input type="radio" id="purpose-general" name="purpose" value="General Inquiry" required>
                        General Inquiry
                    </label>
                    <label for="purpose-reservation">
                        <input type="radio" id="purpose-reservation" name="purpose" value="Reservation Question">
                        Reservation Question
                    </label>
                    <label for="purpose-suggestion">
                        <input type="radio" id="purpose-suggestion" name="purpose" value="Website Suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>

                <div class="form-group newsletter-group">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-list">
                <figure>
                    <img src="images/employee1.jpg" alt="Alex Rivera, Head River Guide">
                    <figcaption>Alex Rivera — Head River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Elena Morales, Trip Reservations Manager">
                    <figcaption>Elena Morales — Reservations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Marcus Vance, Safety & Gear Coordinator">
                    <figcaption>Marcus Vance — Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ⚓ Exciting Expeditions ⚓ Fernando José Rodríguez Henríquez</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="https://linkedin.com" target="_blank"><img src="images/linkedin.png" alt="LinkedIn"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.png" alt="Instagram"></a>
        </nav>
    </footer>
</body>
</html>
